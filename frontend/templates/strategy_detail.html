{% extends "base.html" %}
{% set title = "Backtest Configuration" %}
{% block content %}
  <section class="panel">
    <h1>Backtest Configuration</h1>
    <p>{{ strategy.description }}</p>
    <form method="post" action="/strategies/{{ strategy.id }}/run">
      <fieldset>
        <legend>Basic Settings</legend>
        <div class="form-grid">
          <label>Start Date
            <input name="start_date" type="date" value="{{ form.start_date }}" required>
          </label>
          <label>End Date
            <input name="end_date" type="date" value="{{ form.end_date }}" required>
          </label>
          <label>Lot Size
            <input name="lot_size" type="number" value="{{ form.lot_size or '' }}" min="1" placeholder="auto">
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Entry Rules</legend>
        <div class="form-grid">
          <label>Entry DTE
            <input name="entry_dte" type="number" value="{{ form.entry_dte }}" min="1" required>
          </label>
          <label>Entry Time
            <input name="entry_time" type="time" value="{{ form.entry_time }}" step="300" required>
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Exit Rules</legend>
        <div class="form-grid">
          <label>Exit Time
            <input name="exit_time" type="time" value="{{ form.exit_time }}" step="300" required>
          </label>
          <label>Total Stop Loss Multiplier
            <input name="total_stop_loss_multiplier" type="number" value="{{ form.total_stop_loss_multiplier or '' }}" min="0" step="0.1" placeholder="none">
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Strike Selection</legend>
        <div class="form-grid">
          <label>Strike Offset
            <input name="strike_offset" type="number" value="{{ form.strike_offset }}" min="0" required>
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Filters</legend>
        <p class="empty">No filters configured.</p>
      </fieldset>
      <button type="submit">Run Backtest</button>
    </form>
  </section>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
{% endblock %}
