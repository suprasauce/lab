openapi: 3.0.3
info:
  title: Options Backtesting API
  version: 0.1.0
paths:
  /api/backtests:
    post:
      operationId: createBacktest
      summary: Submit a backtest job
      description: >-
        Submits the supplied Starlark strategy to the server as an asynchronous
        backtest job. Returns the backtest ID when the job is accepted, without
        waiting for execution to complete.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user submitting the backtest.
          schema:
            type: string
            minLength: 1
          example: user-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBacktestRequest'
      responses:
        '202':
          description: Backtest job accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBacktestResponse'
              example:
                id: bt_123
        '400':
          description: Missing or invalid X-User-ID header, request body, script syntax, or script usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Script must define initialize(ctx) and on_candle(ctx).
        '500':
          description: Unexpected failure while submitting the backtest job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Backtest job submission failed.
    get:
      operationId: listBacktests
      summary: List the user's backtests
      description: >-
        Returns only backtests belonging to the user identified by X-User-ID,
        ordered by created_at descending (newest first). Returns an empty
        backtests array when the user has no backtests. Results are not paginated.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving their backtests.
          schema:
            type: string
            minLength: 1
          example: user-123
      responses:
        '200':
          description: The user's backtests, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestListResponse'
              examples:
                backtests:
                  summary: Backtests ordered by creation time
                  value:
                    backtests:
                      - id: bt_124
                        status: RUNNING
                        created_at: '2026-11-05T10:15:00Z'
                      - id: bt_123
                        status: COMPLETED
                        created_at: '2026-11-05T10:00:00Z'
                empty:
                  summary: No backtests for this user
                  value:
                    backtests: []
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '500':
          description: Unexpected failure while listing the user's backtests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve backtests.
  /api/backtests/{id}:
    get:
      operationId: getBacktest
      summary: Retrieve backtest status and completed results
      description: >-
        Returns the current status of the backtest identified by id for the user
        supplied in X-User-ID. Completed jobs include summary and trades; failed
        jobs include error. Pending and running jobs include only id and status.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique backtest identifier returned when submitting the job.
          schema:
            type: string
            minLength: 1
          example: bt_123
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving the backtest.
          schema:
            type: string
            minLength: 1
          example: user-123
      responses:
        '200':
          description: Current backtest status, including results only when completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
              examples:
                pending:
                  summary: Waiting for execution
                  value:
                    id: bt_123
                    status: PENDING
                    script: |
                      def initialize(ctx):
                          ctx.configure()

                          expiries = ctx.get_expiries(
                              underlying="NIFTY",
                              start="2026-01-01",
                              end="2026-06-30",
                          )

                          for expiry in expiries:
                              ctx.state.clear()
                              ctx.state["expiry"] = expiry
                              ctx.simulate(expiry)


                      def on_candle(ctx):
                          expiry = ctx.state["expiry"]
                          dte = expiry.get_dte(ctx.date)

                          # Sell an ATM + 2 call between 45 and 22 DTE, after 09:30.
                          if 21 < dte <= 45 and ctx.time > "09:30":
                              if "entry_order_id" not in ctx.state:
                                  symbol = ctx.option_chain(
                                      underlying=expiry.underlying,
                                      expiry=expiry.date,
                                      option_type="CE",
                                      filter=filter(type="offset", value=2),
                                  )

                                  if symbol != None:
                                      ctx.state["symbol"] = symbol
                                      ctx.state["entry_order_id"] = ctx.place_order(
                                          tradingsymbol=symbol,
                                          quantity=-1,
                                      )

                          # Close at or below 21 DTE, from 15:15 onward.
                          if dte <= 21 and ctx.time >= "15:15":
                              if "entry_order_id" in ctx.state and "exit_order_id" not in ctx.state:
                                  entry = ctx.order(ctx.state["entry_order_id"])

                                  if entry.status == "FILLED":
                                      ctx.state["exit_order_id"] = ctx.place_order(
                                          tradingsymbol=ctx.state["symbol"],
                                          quantity=1,
                                      )
                completed:
                  summary: Completed backtest
                  value:
                    id: bt_123
                    status: COMPLETED
                    script: |
                      def initialize(ctx):
                          ctx.configure()

                          expiries = ctx.get_expiries(
                              underlying="NIFTY",
                              start="2026-01-01",
                              end="2026-06-30",
                          )

                          for expiry in expiries:
                              ctx.state.clear()
                              ctx.state["expiry"] = expiry
                              ctx.simulate(expiry)


                      def on_candle(ctx):
                          expiry = ctx.state["expiry"]
                          dte = expiry.get_dte(ctx.date)

                          # Sell an ATM + 2 call between 45 and 22 DTE, after 09:30.
                          if 21 < dte <= 45 and ctx.time > "09:30":
                              if "entry_order_id" not in ctx.state:
                                  symbol = ctx.option_chain(
                                      underlying=expiry.underlying,
                                      expiry=expiry.date,
                                      option_type="CE",
                                      filter=filter(type="offset", value=2),
                                  )

                                  if symbol != None:
                                      ctx.state["symbol"] = symbol
                                      ctx.state["entry_order_id"] = ctx.place_order(
                                          tradingsymbol=symbol,
                                          quantity=-1,
                                      )

                          # Close at or below 21 DTE, from 15:15 onward.
                          if dte <= 21 and ctx.time >= "15:15":
                              if "entry_order_id" in ctx.state and "exit_order_id" not in ctx.state:
                                  entry = ctx.order(ctx.state["entry_order_id"])

                                  if entry.status == "FILLED":
                                      ctx.state["exit_order_id"] = ctx.place_order(
                                          tradingsymbol=ctx.state["symbol"],
                                          quantity=1,
                                      )
                    summary:
                      total_trades: 2
                      total_pnl: 4592.25
                    positions:
                      - simulation_id: '1'
                        tradingsymbol: NIFTY-20260127-26000-CE
                        quantity: 0
                        average_price: 461.85
                        realized_pnl: 4592.25
                        unrealized_pnl: 0.00
                        total_pnl:
                          - timestamp: '2025-12-15T09:35:00+05:30'
                            pnl: -65.00
                    trades:
                      - id: 1/1
                        simulation_id: '1'
                        tradingsymbol: NIFTY-20260127-26000-CE
                        timestamp: '2025-12-15T09:30:00+05:30'
                        price: 461.85
                        quantity: -1
                      - id: 1/2
                        simulation_id: '1'
                        tradingsymbol: NIFTY-20260127-26000-CE
                        timestamp: '2026-01-06T15:15:00+05:30'
                        price: 391.20
                        quantity: 1
                failed:
                  summary: Backtest execution failed
                  value:
                    id: bt_123
                    status: FAILED
                    script: |
                      def initialize(ctx):
                          ctx.configure()

                          expiries = ctx.get_expiries(
                              underlying="NIFTY",
                              start="2026-01-01",
                              end="2026-06-30",
                          )

                          for expiry in expiries:
                              ctx.state.clear()
                              ctx.state["expiry"] = expiry
                              ctx.simulate(expiry)


                      def on_candle(ctx):
                          expiry = ctx.state["expiry"]
                          dte = expiry.get_dte(ctx.date)

                          # Sell an ATM + 2 call between 45 and 22 DTE, after 09:30.
                          if 21 < dte <= 45 and ctx.time > "09:30":
                              if "entry_order_id" not in ctx.state:
                                  symbol = ctx.option_chain(
                                      underlying=expiry.underlying,
                                      expiry=expiry.date,
                                      option_type="CE",
                                      filter=filter(type="offset", value=2),
                                  )

                                  if symbol != None:
                                      ctx.state["symbol"] = symbol
                                      ctx.state["entry_order_id"] = ctx.place_order(
                                          tradingsymbol=symbol,
                                          quantity=-1,
                                      )

                          # Close at or below 21 DTE, from 15:15 onward.
                          if dte <= 21 and ctx.time >= "15:15":
                              if "entry_order_id" in ctx.state and "exit_order_id" not in ctx.state:
                                  entry = ctx.order(ctx.state["entry_order_id"])

                                  if entry.status == "FILLED":
                                      ctx.state["exit_order_id"] = ctx.place_order(
                                          tradingsymbol=ctx.state["symbol"],
                                          quantity=1,
                                      )
                    error: Insufficient historical candle data
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '404':
          description: Backtest not found for the specified user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Backtest not found.
        '500':
          description: Unexpected failure while retrieving the backtest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve backtest.
  /api/strategies:
    post:
      operationId: createStrategy
      summary: Create a strategy
      description: Saves a new strategy belonging to the user identified by X-User-ID.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user creating the strategy.
          schema:
            type: string
            minLength: 1
          example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRequest'
      responses:
        '201':
          description: Strategy created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrategyResponse'
              example:
                id: '1'
        '400':
          description: Missing or invalid X-User-ID header or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Name and script are required.
        '500':
          description: Unexpected failure while creating the strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to create strategy.
    get:
      operationId: listStrategies
      summary: List the user's strategies
      description: >-
        Returns only strategies belonging to the user identified by X-User-ID,
        ordered by updated_at descending, then id descending. Includes the complete
        script for each strategy. Returns an empty strategies array when none exist.
        Results are not paginated.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving their strategies.
          schema:
            type: string
            minLength: 1
          example: '1'
      responses:
        '200':
          description: The user's strategies, most recently updated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyListResponse'
              examples:
                strategies:
                  summary: Saved strategies
                  value:
                    strategies:
                      - id: '1'
                        name: Short Strangle
                        description: Sell OTM call and put options to collect premium.
                        script: '...'
                        created_at: '2026-11-09T10:00:00Z'
                        updated_at: '2026-11-09T10:00:00Z'
                empty:
                  summary: No strategies for this user
                  value:
                    strategies: []
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '500':
          description: Unexpected failure while listing the user's strategies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve strategies.
  /api/strategies/{id}:
    put:
      operationId: updateStrategy
      summary: Update a saved strategy
      description: >-
        Replaces the strategy's name and complete script with the supplied values.
        The backend must enforce ownership using X-User-ID; a strategy that does
        not exist or belongs to another user returns 404. The user_id is not
        editable. Updates updated_at to the modification time while preserving
        the strategy ID, owner, and created_at. Description is optional; omitting
        it replaces the saved description with an empty string.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the strategy to update.
          schema:
            type: string
            minLength: 1
          example: '123'
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user updating their strategy.
          schema:
            type: string
            minLength: 1
          example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRequest'
            example:
              name: NIFTY Short Strangle
              description: Updated strategy description.
              script: '...'
      responses:
        '200':
          description: Strategy updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrategyResponse'
              example:
                id: '123'
        '400':
          description: Missing or invalid X-User-ID header, strategy ID, or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid strategy ID, name, and script are required.
        '404':
          description: Strategy does not exist or does not belong to the requesting user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Strategy not found.
        '500':
          description: Unexpected failure while updating the strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to update strategy.
  /api/templates:
    get:
      operationId: listTemplates
      summary: List predefined strategy templates
      description: >-
        Returns predefined strategies belonging to the platform's internally
        configured template owner, regardless of the requesting user's ID.
        No user identification header, request body, or query parameters are
        required. The template owner is not supplied by or exposed to clients.
        Includes complete scripts, ordered by name ascending, then id ascending.
        Returns an empty templates array when none exist. Results are not paginated.
      responses:
        '200':
          description: Predefined templates ordered by name ascending, then id ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesListResponse'
              examples:
                templates:
                  summary: Predefined strategy templates
                  value:
                    templates:
                      - id: '1'
                        name: Short Strangle
                        description: Sell OTM call and put options to collect premium.
                        script: '...'
                        created_at: '2026-11-09T10:00:00Z'
                        updated_at: '2026-11-09T10:00:00Z'
                empty:
                  summary: No templates available
                  value:
                    templates: []
        '500':
          description: Unexpected failure while retrieving predefined templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve templates.
components:
  schemas:
    TemplatesListResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          description: Templates ordered by name ASC, id ASC; empty if none exist.
          items:
            $ref: '#/components/schemas/Strategy'
    CreateStrategyRequest:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the strategy.
          example: Short Strangle
        description:
          type: string
          default: ''
          description: Optional strategy description. Empty strings are allowed; omission stores an empty string on create or update.
          example: Sell OTM call and put options to collect premium.
        script:
          type: string
          minLength: 1
          description: Complete Starlark strategy source.
          example: '...'
    CreateStrategyResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique identifier of the created strategy.
          example: '1'
    Strategy:
      type: object
      required: [id, name, description, script, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique strategy identifier.
          example: '1'
        name:
          type: string
          description: Display name of the strategy.
          example: Short Strangle
        description:
          type: string
          description: Strategy description, or an empty string when none was supplied.
          example: Sell OTM call and put options to collect premium.
        script:
          type: string
          description: Complete Starlark strategy source.
          example: '...'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the strategy was created.
          example: '2026-11-09T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the strategy was last updated.
          example: '2026-11-09T10:00:00Z'
    StrategyListResponse:
      type: object
      required: [strategies]
      properties:
        strategies:
          type: array
          description: Strategies ordered by updated_at DESC, id DESC; empty if none exist.
          items:
            $ref: '#/components/schemas/Strategy'
    CreateBacktestRequest:
      type: object
      required:
        - script
      properties:
        script:
          type: string
          minLength: 1
          description: Starlark source defining initialize(ctx) and on_candle(ctx).
          example: |
            def initialize(ctx):
                ctx.configure()

                expiries = ctx.get_expiries(
                    underlying="NIFTY",
                    start="2026-01-01",
                    end="2026-06-30",
                )

                for expiry in expiries:
                    ctx.state.clear()
                    ctx.state["expiry"] = expiry
                    ctx.simulate(expiry)


            def on_candle(ctx):
                expiry = ctx.state["expiry"]
                dte = expiry.get_dte(ctx.date)

                # Sell an ATM + 2 call between 45 and 22 DTE, after 09:30.
                if 21 < dte <= 45 and ctx.time > "09:30":
                    if "entry_order_id" not in ctx.state:
                        symbol = ctx.option_chain(
                            underlying=expiry.underlying,
                            expiry=expiry.date,
                            option_type="CE",
                            filter=filter(type="offset", value=2),
                        )

                        if symbol != None:
                            ctx.state["symbol"] = symbol
                            ctx.state["entry_order_id"] = ctx.place_order(
                                tradingsymbol=symbol,
                                quantity=-1,
                            )

                # Close at or below 21 DTE, from 15:15 onward.
                if dte <= 21 and ctx.time >= "15:15":
                    if "entry_order_id" in ctx.state and "exit_order_id" not in ctx.state:
                        entry = ctx.order(ctx.state["entry_order_id"])

                        if entry.status == "FILLED":
                            ctx.state["exit_order_id"] = ctx.place_order(
                                tradingsymbol=ctx.state["symbol"],
                                quantity=1,
                            )
    CreateBacktestResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          description: Unique identifier of the submitted backtest job.
          example: bt_123
    BacktestStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: Current backtest job status.
    BacktestListResponse:
      type: object
      required: [backtests]
      properties:
        backtests:
          type: array
          description: The user's backtests ordered by created_at descending; empty if none exist.
          items:
            type: object
            additionalProperties: false
            required: [id, status, created_at]
            properties:
              id:
                type: string
                minLength: 1
                description: Unique backtest identifier.
              status:
                $ref: '#/components/schemas/BacktestStatus'
              created_at:
                type: string
                format: date-time
                description: Timestamp when the backtest job was created.
    BacktestResponse:
      type: object
      required: [id, status, script]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique backtest identifier.
          example: bt_123
        status:
          $ref: '#/components/schemas/BacktestStatus'
        script:
          type: string
          description: Exact saved script from this backtest record, independent of later strategy edits.
        summary:
          $ref: '#/components/schemas/BacktestSummary'
        positions:
          type: array
          description: One position per simulation and trading symbol, including closed positions.
          items:
            $ref: '#/components/schemas/BacktestPosition'
        trades:
          type: array
          description: Individual order fills, identified by simulation and trading symbol.
          items:
            $ref: '#/components/schemas/BacktestTrade'
        error:
          type: string
          description: Execution failure message, present only for FAILED backtests.
      oneOf:
        - properties:
            status:
              enum: [PENDING, RUNNING]
          not:
            anyOf:
              - required: [summary]
              - required: [trades]
              - required: [positions]
              - required: [error]
        - required: [summary, positions, trades]
          properties:
            status:
              enum: [COMPLETED]
          not:
            required: [error]
        - required: [error]
          properties:
            status:
              enum: [FAILED]
          not:
            anyOf:
              - required: [summary]
              - required: [trades]
              - required: [positions]
    BacktestSummary:
      type: object
      additionalProperties: false
      required: [total_trades, total_pnl]
      properties:
        total_trades:
          type: integer
          format: int64
          minimum: 0
          description: Number of filled orders across all simulations.
          example: 1
        total_pnl:
          type: number
          multipleOf: 0.01
          description: Sum of positions' cumulative realized P&L in rupees, including previous closes of reopened positions and each contract's expiry lot size.
          example: 4592.25
    BacktestPosition:
      type: object
      description: Current position for a simulation and trading symbol. Reopening reuses this position and preserves cumulative realized P&L.
      required: [simulation_id, tradingsymbol, quantity, average_price, realized_pnl, unrealized_pnl, total_pnl]
      properties:
        simulation_id:
          type: string
          description: Sequential simulation identifier, scoped to the backtest.
          example: '1'
        tradingsymbol:
          type: string
          example: NIFTY-20260127-26000-CE
        quantity:
          type: integer
          format: int64
          description: "Signed lots: positive for long, negative for short, zero when closed."
        average_price:
          type: number
          multipleOf: 0.01
          description: Average entry price of the latest opening, in rupees.
        realized_pnl:
          type: number
          multipleOf: 0.01
          description: Cumulative realized P&L across all closes of this position, in rupees.
        unrealized_pnl:
          type: number
          multipleOf: 0.01
          description: Latest observed unrealized P&L in rupees; zero when closed. Missing candles retain the last observed value.
        total_pnl:
          type: array
          description: Cumulative realized plus current unrealized P&L history. Closed positions continue recording realized P&L. Open positions with missing candles add no point.
          items:
            $ref: '#/components/schemas/PnLPoint'
    PnLPoint:
      type: object
      required: [timestamp, pnl]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Simulation observation time in IST, when the candle has completed.
        pnl:
          type: number
          multipleOf: 0.01
          description: Total position P&L in rupees, including cumulative realized P&L and the expiry lot-size multiplier.
    BacktestTrade:
      type: object
      description: One order execution. The simulation ID and trading symbol identify its position. Prices are in rupees and timestamps are in IST.
      required: [id, simulation_id, tradingsymbol, timestamp, price, quantity]
      properties:
        id:
          type: string
          description: Unique fill identifier within the backtest, formed from simulation and order IDs.
          example: 1/1
        simulation_id:
          type: string
          example: '1'
        tradingsymbol:
          type: string
          example: NIFTY-20260127-26000-CE
        timestamp:
          type: string
          format: date-time
          description: Actual execution candle start time in IST.
        price:
          type: number
          multipleOf: 0.01
          description: Execution price in rupees.
        quantity:
          type: integer
          format: int64
          description: Signed lots; positive buys and negative sells. Never zero.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing why the request failed.
