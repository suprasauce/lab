openapi: 3.0.3
info:
  title: Options Backtesting API
  version: 0.1.0
paths:
  /api/backtests:
    post:
      operationId: createBacktest
      summary: Submit a backtest job
      description: >-
        Submits the supplied Starlark strategy to the server as an asynchronous
        backtest job. Returns the backtest ID when the job is accepted, without
        waiting for execution to complete.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user submitting the backtest.
          schema:
            type: string
            minLength: 1
          example: user-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBacktestRequest'
      responses:
        '202':
          description: Backtest job accepted for asynchronous execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBacktestResponse'
              example:
                id: bt_123
        '400':
          description: Missing or invalid X-User-ID header, request body, script syntax, or script usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Script must define initialize(ctx) and on_candle(ctx).
        '500':
          description: Unexpected failure while submitting the backtest job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Backtest job submission failed.
    get:
      operationId: listBacktests
      summary: List the user's backtests
      description: >-
        Returns only backtests belonging to the user identified by X-User-ID,
        ordered by created_at descending (newest first). Returns an empty
        backtests array when the user has no backtests. Results are not paginated.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving their backtests.
          schema:
            type: string
            minLength: 1
          example: user-123
      responses:
        '200':
          description: The user's backtests, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestListResponse'
              examples:
                backtests:
                  summary: Backtests ordered by creation time
                  value:
                    backtests:
                      - id: bt_124
                        status: RUNNING
                        created_at: '2026-11-05T10:15:00Z'
                      - id: bt_123
                        status: COMPLETED
                        created_at: '2026-11-05T10:00:00Z'
                empty:
                  summary: No backtests for this user
                  value:
                    backtests: []
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '500':
          description: Unexpected failure while listing the user's backtests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve backtests.
  /api/backtests/{id}:
    get:
      operationId: getBacktest
      summary: Retrieve backtest status and completed results
      description: >-
        Returns the current status of the backtest identified by id for the user
        supplied in X-User-ID. Completed jobs include summary and trades; failed
        jobs include error. Pending and running jobs include only id and status.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique backtest identifier returned when submitting the job.
          schema:
            type: string
            minLength: 1
          example: bt_123
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving the backtest.
          schema:
            type: string
            minLength: 1
          example: user-123
      responses:
        '200':
          description: Current backtest status, including results only when completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
              examples:
                pending:
                  summary: Waiting for execution
                  value:
                    id: bt_123
                    status: PENDING
                completed:
                  summary: Completed backtest
                  value:
                    id: bt_123
                    status: COMPLETED
                    summary:
                      total_trades: 1
                      total_pnl: 5298.75
                    trades:
                      - expiry: '2026-01-27'
                        underlying: NIFTY
                        strike: 26000.00
                        option_type: CALL
                        side: SHORT
                        entry_timestamp: '2025-12-15T09:30:00+05:30'
                        exit_timestamp: '2026-01-06T15:15:00+05:30'
                        entry_price: 461.85
                        exit_price: 391.20
                        quantity: 75
                        pnl: 5298.75
                failed:
                  summary: Backtest execution failed
                  value:
                    id: bt_123
                    status: FAILED
                    error: Insufficient historical candle data
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '404':
          description: Backtest not found for the specified user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Backtest not found.
        '500':
          description: Unexpected failure while retrieving the backtest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve backtest.
  /api/v1/strategies:
    post:
      operationId: createStrategy
      summary: Create a strategy
      description: Saves a new strategy belonging to the user identified by X-User-ID.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user creating the strategy.
          schema:
            type: string
            minLength: 1
          example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRequest'
      responses:
        '201':
          description: Strategy created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrategyResponse'
              example:
                id: '1'
        '400':
          description: Missing or invalid X-User-ID header or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Name and script are required.
        '500':
          description: Unexpected failure while creating the strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to create strategy.
    get:
      operationId: listStrategies
      summary: List the user's strategies
      description: >-
        Returns only strategies belonging to the user identified by X-User-ID,
        ordered by updated_at descending, then id descending. Includes the complete
        script for each strategy. Returns an empty strategies array when none exist.
        Results are not paginated.
      parameters:
        - name: X-User-ID
          in: header
          required: true
          description: Unique identifier of the user retrieving their strategies.
          schema:
            type: string
            minLength: 1
          example: '1'
      responses:
        '200':
          description: The user's strategies, most recently updated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyListResponse'
              examples:
                strategies:
                  summary: Saved strategies
                  value:
                    strategies:
                      - id: '1'
                        name: Short Strangle
                        script: '...'
                        created_at: '2026-11-09T10:00:00Z'
                        updated_at: '2026-11-09T10:00:00Z'
                empty:
                  summary: No strategies for this user
                  value:
                    strategies: []
        '401':
          description: Missing or invalid X-User-ID header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A valid X-User-ID header is required.
        '500':
          description: Unexpected failure while listing the user's strategies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to retrieve strategies.
components:
  schemas:
    CreateStrategyRequest:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the strategy.
          example: Short Strangle
        script:
          type: string
          minLength: 1
          description: Complete Starlark strategy source.
          example: '...'
    CreateStrategyResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique identifier of the created strategy.
          example: '1'
    Strategy:
      type: object
      required: [id, name, script, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique strategy identifier.
          example: '1'
        name:
          type: string
          description: Display name of the strategy.
          example: Short Strangle
        script:
          type: string
          description: Complete Starlark strategy source.
          example: '...'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the strategy was created.
          example: '2026-11-09T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the strategy was last updated.
          example: '2026-11-09T10:00:00Z'
    StrategyListResponse:
      type: object
      required: [strategies]
      properties:
        strategies:
          type: array
          description: Strategies ordered by updated_at DESC, id DESC; empty if none exist.
          items:
            $ref: '#/components/schemas/Strategy'
    CreateBacktestRequest:
      type: object
      required:
        - script
      properties:
        script:
          type: string
          minLength: 1
          description: Starlark source defining initialize(ctx) and on_candle(ctx).
          example: |
            def initialize(ctx):
                ctx.configure(underlying="NIFTY", start_date="2026-01-01", end_date="2026-06-30")

            def on_candle(ctx):
                if ctx.dte <= 45 and ctx.time >= "09:30" and "entry" not in ctx.state:
                    ctx.state["entry"] = ctx.place_order(contract=atm_option("CALL", offset=2), side="SELL", quantity=75)
                if ctx.dte <= 21 and ctx.time >= "15:15" and "entry" in ctx.state and "exit" not in ctx.state:
                    entry = ctx.order(ctx.state["entry"])
                    if entry.status == "FILLED":
                        ctx.state["exit"] = ctx.place_order(contract=entry.contract_id, side="BUY", quantity=75)
    CreateBacktestResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          description: Unique identifier of the submitted backtest job.
          example: bt_123
    BacktestStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: Current backtest job status.
    BacktestListResponse:
      type: object
      required: [backtests]
      properties:
        backtests:
          type: array
          description: The user's backtests ordered by created_at descending; empty if none exist.
          items:
            type: object
            additionalProperties: false
            required: [id, status, created_at]
            properties:
              id:
                type: string
                minLength: 1
                description: Unique backtest identifier.
              status:
                $ref: '#/components/schemas/BacktestStatus'
              created_at:
                type: string
                format: date-time
                description: Timestamp when the backtest job was created.
    BacktestResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique backtest identifier.
          example: bt_123
        status:
          $ref: '#/components/schemas/BacktestStatus'
        summary:
          $ref: '#/components/schemas/BacktestSummary'
        trades:
          type: array
          description: One object per CSV result row, including positions left open.
          items:
            $ref: '#/components/schemas/BacktestTrade'
        error:
          type: string
          description: Execution failure message, present only for FAILED backtests.
      oneOf:
        - properties:
            status:
              enum: [PENDING, RUNNING]
          not:
            anyOf:
              - required: [summary]
              - required: [trades]
              - required: [error]
        - required: [summary, trades]
          properties:
            status:
              enum: [COMPLETED]
          not:
            required: [error]
        - required: [error]
          properties:
            status:
              enum: [FAILED]
          not:
            anyOf:
              - required: [summary]
              - required: [trades]
    BacktestSummary:
      type: object
      additionalProperties: false
      required: [total_trades, total_pnl]
      properties:
        total_trades:
          type: integer
          format: int64
          minimum: 0
          description: Number of result rows, including positions left open.
          example: 1
        total_pnl:
          type: number
          multipleOf: 0.01
          description: Sum of realized trade P&L in rupees; open positions contribute zero.
          example: 5298.75
    BacktestTrade:
      type: object
      description: >-
        One CSV result row for a position lifecycle. Prices and P&L are in rupees
        with paise precision. Timestamps are RFC3339 in Asia/Kolkata (IST).
        CSV blank exit fields and P&L for open positions are represented as null.
      required:
        - expiry
        - underlying
        - strike
        - option_type
        - side
        - entry_timestamp
        - exit_timestamp
        - entry_price
        - exit_price
        - quantity
        - pnl
      properties:
        expiry:
          type: string
          format: date
          description: Option expiry calendar date.
        underlying:
          type: string
          description: Underlying symbol, such as NIFTY.
        strike:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Strike price in rupees.
        option_type:
          type: string
          enum: [CALL, PUT]
        side:
          type: string
          enum: [LONG, SHORT]
          description: Position direction, as exported by the CSV.
        entry_timestamp:
          type: string
          format: date-time
          description: Actual entry candle start time in IST.
        exit_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Actual exit candle start time in IST, or null while open.
        entry_price:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Entry price in rupees.
        exit_price:
          type: number
          minimum: 0
          multipleOf: 0.01
          nullable: true
          description: Exit price in rupees, or null while open.
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Quantity in units, not lots.
        pnl:
          type: number
          multipleOf: 0.01
          nullable: true
          description: Realized P&L in rupees; null while open.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing why the request failed.
